[package]
name = "crateful"
version = "0.1.0"
description = "template start for track sorter cli"
authors = ["michael"]
license = "MIT"
edition = "2024"

[dependencies]
crossterm = { version = "0.29", features = ["event-stream"] }
walkdir = "2"
futures = "0.3.31"
ratatui = "0.30.0"
tokio = { version = "1.40.0", features = ["rt-multi-thread", "macros", "sync", "time"] }
color-eyre = "0.6.3"
rodio = "0.21.1"
derive_setters = "0.1.8"
ratatui-explorer = { git = "https://github.com/cgzones/ratatui-explorer.git", branch = "update" }
dotenv = "0.15.0"
cli-log = "2.1.0"
directories = "5.0"
dirs = "6.0.0"
libc = "0.2"

